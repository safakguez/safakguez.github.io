<!-- Schulversion: Code-Abfrage vor dem Spiel (tool/build_school_web.py kopiert diese Seite nach …/atlaszoom/schule/).
     Gültige Codes stehen als SHA-256-Hash mit Ablaufdatum in codes.json (aus store/schulcodes.csv, tool/schulcode.py).
     Klassenlink: …/atlaszoom/schule/?code=ABCD-2345 – der Browser merkt sich den Code, danach startet das Spiel direkt.
     Keine Cookies, keine externen Anfragen, keine Werbung, keine Käufe. -->
<style>
:root{--bg:#e9eff6;--card:#fff;--ink:#0f2238;--muted:#4b6280;--acc:#1f6fd1;--acc-dark:#154f97;--line:#d4deea;--warm:#fff4da;--warm-line:#f2b33d;--err:#b9472f}
@media (prefers-color-scheme:dark){:root{--bg:#0a1626;--card:#13283f;--ink:#eaf2fb;--muted:#8ea7c3;--acc:#5aa2ff;--acc-dark:#2f6fc4;--line:#22385a;--warm:#2b2414;--warm-line:#8a6a1f;--err:#ff8a6a}}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#gate{box-sizing:border-box;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:var(--card);border-radius:24px;max-width:440px;width:100%;padding:28px 24px;box-shadow:0 2px 0 var(--line)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.brand img{width:48px;height:48px;border-radius:12px}
h1{font-size:24px;margin:0;line-height:1.15}
.sub{color:var(--acc);font-weight:800;font-size:14px;margin:0}
p{line-height:1.5;margin:14px 0}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 180px;min-width:0;font:inherit;font-size:18px;letter-spacing:1px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
input:not(:placeholder-shown){text-transform:uppercase}
input:focus{outline:none;border-color:var(--acc)}
button{font:inherit;font-weight:800;font-size:17px;color:#fff;background:var(--acc);border:0;border-radius:14px;padding:12px 22px;box-shadow:0 3px 0 var(--acc-dark);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--err);font-weight:800;min-height:1.5em;margin:10px 0 0}
.small{font-size:14px;color:var(--muted)}
a{color:var(--acc);font-weight:800}
.stores{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stores a{display:inline-block;text-decoration:none;color:var(--ink);background:var(--warm);border:2px solid var(--warm-line);border-radius:12px;padding:8px 12px;font-size:14px}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.foot{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
.foot a{font-weight:600;color:var(--muted)}
</style>

  var params = new URLSearchParams(location.search);
  function pickLang(raw) {
    var l = String(raw || 'en').replace('_', '-').toLowerCase();
    if (l.indexOf('zh') === 0) return /hant|-tw|-hk|-mo/.test(l) ? 'zh-Hant' : 'zh';
    var base = l.split('-')[0];
    return T[base] ? base : 'en';
  }
  var lang = pickLang(params.get('lang') || (navigator.languages && navigator.languages[0]) || navigator.language);
  var t = T[lang];
  document.documentElement.lang = lang;
  function norm(c) { return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function sha256(s) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (b) {
      return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    });
  }
  var db = null;
  function codes() {
    if (db) return Promise.resolve(db);
    return fetch('codes.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (j) { db = j; return j; });
  }
  function check(code) {  // 'ok' | 'invalid' | 'expired'
    var n = norm(code);
    if (n.length !== 8) return Promise.resolve('invalid');
    return Promise.all([codes(), sha256(SALT + n)]).then(function (r) {
      var until = r[0].codes[r[1]];
      if (!until) return 'invalid';
      var d = new Date(), iso = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
      return iso > until ? 'expired' : 'ok';
    });
  }
  function store(c) { try { localStorage.setItem(KEY, norm(c)); } catch (e) {} }
  function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function forget() { try { localStorage.removeItem(KEY); } catch (e) {} }
  function startGame() {
    // Sprache nur weitergeben, wenn sie im Link stand – sonst wählt das Spiel selbst (Gerätesprache / 🌐).
    location.replace('spiel.html' + (params.get('lang') ? '?lang=' + encodeURIComponent(params.get('lang')) : ''));
  }
  function showGate(problem) {
    document.getElementById('t0').textContent = t[0];
    document.getElementById('t1').textContent = t[1];
    var input = document.getElementById('code');
    input.placeholder = t[2]; input.setAttribute('aria-label', t[2]);
    var btn = document.getElementById('go'); btn.textContent = t[3];
    var err = document.getElementById('err');
    err.textContent = problem === 'expired' ? t[5] : problem === 'invalid' ? t[4] : '';
    document.getElementById('t6').textContent = t[6];
    document.getElementById('mail').href = 'mailto:contact@decly.app?subject=' + encodeURIComponent('Schulcode / School code – Atlas Zoom');
    var g = document.getElementById('guide'); g.textContent = t[8]; g.href = '../' + t[10];
    document.getElementById('t7').textContent = t[7];
    document.getElementById('f').addEventListener('submit', function (ev) {
      ev.preventDefault(); btn.disabled = true;
      check(input.value).then(function (r) {
        if (r === 'ok') { store(input.value); startGame(); return; }
        err.textContent = r === 'expired' ? t[5] : t[4]; btn.disabled = false;
      }).catch(function () { err.textContent = t[4]; btn.disabled = false; });
    });
    document.getElementById('gate').hidden = false;
    if (problem !== 'expired') input.focus();
  }
  var fromUrl = params.get('code');
  var code = fromUrl || saved();
  if (!code || !window.crypto || !crypto.subtle) { showGate(fromUrl ? 'invalid' : null); return; }
  check(code).then(function (r) {
    if (r === 'ok') { store(code); startGame(); return; }
    if (!fromUrl) forget();
    showGate(r);
  }).catch(function () { showGate(null); });
})();
